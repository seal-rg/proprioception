name = "qwen35_logits"
family = "qwen3_5_moe"
domain = "logits"
output = "${PROPRIOCEPTION_OUTPUTS}/evals"
gpu = "auto"
gpu_memory_utilization = 0.95
max_model_len = 40960
concurrency = 32
judge_model = "openai/gpt-5.6-luna"

[models.base]
checkpoint = "${PROPRIOCEPTION_MODELS}/Qwen3.5-35B-A3B"
role = "base"

[suite.template]
data_dirs = ["${PROPRIOCEPTION_DATA}/qwen35_logits_all"]
[suite.stability]
train_dataset = "${PROPRIOCEPTION_DATA}/qwen35_logits_all"
