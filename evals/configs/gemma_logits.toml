name = "gemma_logits"
family = "gemma4_26b_a4b"
domain = "logits"
output = "${PROPRIOCEPTION_OUTPUTS}/evals"
gpu = "auto"
gpu_memory_utilization = 0.95
max_model_len = 40960
concurrency = 32
judge_model = "openai/gpt-5.6-luna"

[models.base]
checkpoint = "${PROPRIOCEPTION_MODELS}/gemma-4-26B-A4B-it"
role = "base"

[suite.template]
data_dirs = ["${PROPRIOCEPTION_DATA}/gemma_logits_all"]
[suite.stability]
train_dataset = "${PROPRIOCEPTION_DATA}/gemma_logits_all"
