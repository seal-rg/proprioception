name = "olmoe_logits"
family = "olmoe_prime"
domain = "logits"
output = "${PROPRIOCEPTION_OUTPUTS}/evals"
gpu = "auto"
gpu_memory_utilization = 0.6
max_model_len = 4096
concurrency = 32
max_tokens = 2048
judge_model = "openai/gpt-5.6-luna"

[models.base]
checkpoint = "${PROPRIOCEPTION_MODELS}/OLMoE-1B-7B-0125-Instruct"
role = "base"

[suite.template]
data_dirs = ["${PROPRIOCEPTION_DATA}/olmoe_logits_all"]
[suite.stability]
train_dataset = "${PROPRIOCEPTION_DATA}/olmoe_logits_all"
[suite.benchmarks]
gen_kwargs = "temperature=0,max_gen_toks=2048"
