name = "lfm_routing"
family = "lfm2_prime"
domain = "routing"
output = "${PROPRIOCEPTION_OUTPUTS}/evals"
gpu = "auto"
gpu_memory_utilization = 0.6
max_model_len = 40960
concurrency = 32
judge_model = "openai/gpt-5.6-luna"

[models.base]
checkpoint = "${PROPRIOCEPTION_MODELS}/LFM2.5-8B-A1B"
role = "base"

[suite.template]
data_dirs = ["${PROPRIOCEPTION_DATA}/lfm_routing_all"]
[suite.stability]
train_dataset = "${PROPRIOCEPTION_DATA}/lfm_routing_all"
