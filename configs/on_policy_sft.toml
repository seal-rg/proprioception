answer_max_tokens = 1024
assistant_fraction = 0.5
batch_size = 24
cmd = "on-policy-sft"
data_dir = "${PROPRIOCEPTION_DATA}/lfm_routing"
eval_every_nth = 50
gen_max_tokens = 1024
gen_temperature = 1.0
grad_accum = 32
gradient_checkpointing = true
init_checkpoint = "${PROPRIOCEPTION_OUTPUTS}/sft-lfm-base/hf"
kl_weight = 0.5
lexical_lookup_decay = 0.9
lexical_lookup_min_count = 5.0
lexical_lookup_seed_samples = 60000
lexical_match_weight = 0.1
lm_segments = ["assistant_pc_reasoning", "assistant_pc_response", "assistant_turn_end"]
lm_weight = 0.1
lr = 2e-5
lr_schedule = "cosine"
micro_batch_tokens = 8192
model = "lfm2_prime"
optimization_dtype = "bfloat16"
output = "${PROPRIOCEPTION_OUTPUTS}/dagger-lfm-base"
queries_per_conversation = 4
resume = "latest"
rounds = 500
save_every_nth = 100
save_final = true
seed = 0
sft_replay_fraction = 0.0
system_prompt_fraction = 0.5
warmup_rounds = 50
